name: Build, security and browser tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build frontend, run API tests and audit NuGet packages
        run: node scripts/build.mjs
      - name: Audit frontend dependencies
        working-directory: client
        run: npm audit --audit-level=low
      - name: Install browser engines
        working-directory: client
        run: npx playwright install --with-deps chromium firefox
      - name: Test desktop, mobile, accessibility and contact flows
        working-directory: client
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            client/playwright-report/
            client/test-results/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aakash-portfolio
          path: artifacts/

  sql-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start isolated SQL Server
        shell: bash
        run: |
          export MSSQL_SA_PASSWORD="Aa1!$(openssl rand -hex 24)"
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          echo "PORTFOLIO_TEST_SQL=Server=127.0.0.1,1433;Database=PortfolioDb;User Id=sa;Password=$MSSQL_SA_PASSWORD;Encrypt=True;TrustServerCertificate=True;Connect Timeout=2" >> "$GITHUB_ENV"
          docker run --detach --name portfolio-sql \
            --publish 127.0.0.1:1433:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_SA_PASSWORD \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Exercise real SQL persistence through contact API
        run: >
          dotnet test server/Portfolio.Api.Tests/Portfolio.Api.Tests.csproj
          --configuration Release
          --filter FullyQualifiedName~SqlSmokeTests
      - name: Remove ephemeral SQL Server
        if: always()
        run: docker rm --force portfolio-sql || true
